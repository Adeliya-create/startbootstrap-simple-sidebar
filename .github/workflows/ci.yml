name: CI/CD Pipeline

# Когда запускать pipeline?
# Только когда пушим в ветку main
on:
  push:
    branches: [ main ]

jobs:

  # Одна задача — собрать и запушить образ
  build-and-push:
    # На каком сервере запускать?
    # ubuntu-latest — бесплатный виртуальный сервер GitHub
    runs-on: ubuntu-latest

    steps:

      # Шаг 1: скачать код репозитория на сервер GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 2: войти в Docker Hub
      # secrets.DOCKERHUB_USERNAME и secrets.DOCKERHUB_TOKEN —
      # это секреты которые мы добавим в настройках GitHub
      # (туда же как в первом проекте)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Шаг 3: собрать Docker образ и запушить на Docker Hub
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Два тега:
          # latest — всегда указывает на последнюю версию
          # github.sha — уникальный ID конкретного коммита
          # Зачем два? latest удобен для быстрого скачивания,
          # sha позволяет откатиться к конкретной версии
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/simple-sidebar:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/simple-sidebar:${{ github.sha }}