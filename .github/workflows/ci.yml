name: CI/CD Pipeline

on:
  push:
    branches: [ master ]

jobs:

  # Одна задача — собрать и запушить образ
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # Шаг 1: скачать код репозитория на сервер GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 2: войти в Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Шаг 3: собрать Docker образ и запушить на Docker Hub
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/simple-sidebar:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/simple-sidebar:${{ github.sha }}
